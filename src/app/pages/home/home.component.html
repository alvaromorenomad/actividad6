<div class="container">
  <div class="row g-3">
    
    @for(cardEmpleado of arrayEmpleados(); track cardEmpleado._id){
          <app-card-usuario [miEmpleado]="cardEmpleado" class="col-12 col-md-6 col-lg-3"></app-card-usuario>
    }

  </div>

  <div class="d-flex justify-content-center m-3">
    <a class="btn border border-3 rounded-circle mx-2" (click)="firstPage()" routerLinkActive="btnActive">1</a>
    <a class="btn border border-3 rounded-circle mx-2" (click)="secondPage()" routerLinkActive="btnActive">2</a>
  </div>  
</div>
